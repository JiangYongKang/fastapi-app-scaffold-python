[project]
name = "fastapi-app-scaffold-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # starlette/anyio 测试客户端的第三方弃用告警，与本脚手架无关：
    # StarletteDeprecationWarning 继承 UserWarning；anyio 的是 DeprecationWarning
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff.lint]
# B008: FastAPI 的 Depends(...) 作为参数默认值是官方推荐写法
ignore = ["B008"]
